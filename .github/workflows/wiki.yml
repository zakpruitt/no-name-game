# Publishes the wiki (docs/wiki, plain static files) to GitHub Pages:
# https://zakpruitt.github.io/no-name-game/ on every push to dev that touches it.
name: Wiki

on:
  push:
    branches: [dev]
    paths: ["docs/wiki/**", ".github/workflows/wiki.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/wiki
      - id: deployment
        uses: actions/deploy-pages@v4
